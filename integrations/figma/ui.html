<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); display: flex; flex-direction: column; height: 100vh; }
  .tabs { display: flex; gap: 4px; padding: 10px 12px 0; }
  .tabs button { flex: 1; height: 30px; border: 0; border-radius: 99px; background: none; color: var(--figma-color-text-secondary); font: 600 12px Inter, system-ui, sans-serif; cursor: pointer; }
  .tabs button.on { background: var(--figma-color-bg-secondary); color: var(--figma-color-text); }
  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; padding: 10px 12px 12px; gap: 8px; }
  .pane.on { display: flex; }
  label { display: block; margin: 0 0 4px; color: var(--figma-color-text-secondary); }
  input, select { width: 100%; height: 30px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); color: inherit; font: inherit; }
  .row { display: flex; gap: 6px; }
  .row select { flex: 1; min-width: 0; }
  button.main { width: 100%; height: 34px; border: 0; border-radius: 99px; font: 600 12px Inter, system-ui, sans-serif; background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); cursor: pointer; flex: none; }
  button.ghost { height: 30px; padding: 0 12px; border: 1px solid var(--figma-color-border); border-radius: 99px; background: none; color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: default; }
  /* square tiles without aspect-ratio: in Figma's webview grid rows with aspect-ratio buttons collapsed and the tiles
     piled on top of each other (bug #49); the height comes from padding-top (a % of the width) instead */
  .grid { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: max-content; gap: 6px; align-content: start; }
  .tile { position: relative; display: block; width: 100%; height: 0; padding: 100% 0 0; border-radius: 10px; overflow: hidden; background: var(--figma-color-bg-secondary); border: 0; cursor: pointer; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile span { position: absolute; left: 4px; right: 4px; bottom: 4px; padding: 2px 6px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .15s; }
  .tile:hover span { opacity: 1; }
  .tile:focus-visible { outline: 2px solid var(--figma-color-border-brand-strong); }
  .empty { grid-column: 1 / -1; padding: 30px 8px; text-align: center; color: var(--figma-color-text-secondary); }
  #st { min-height: 18px; color: var(--figma-color-text-secondary); }
  .ic-list { flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 6px; align-content: start; }
  .ic-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: var(--figma-color-bg-secondary); }
  .ic-row img { width: 28px; height: 28px; flex: none; background: #fff; border-radius: 6px; padding: 2px; }
  .ic-row b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .ic-row small { color: var(--figma-color-text-secondary); }
  #st.err { color: var(--figma-color-text-danger); }
  #st.ok { color: var(--figma-color-text-success); }
  details { color: var(--figma-color-text-secondary); }
  details input { margin-top: 6px; }
  .lang { float: right; width: auto; height: 24px; padding: 0 8px; font-size: 11px; }
</style>

    const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: own });
    for (let n; (n = walk.nextNode());) {
      const raw = n.__ru || (n.__ru = n.nodeValue), key = raw.trim();
      if (key) n.nodeValue = raw.replace(key, T(key));
    }
    for (const el of document.querySelectorAll('[placeholder], [title]')) {
      for (const a of ['placeholder', 'title']) if (el.hasAttribute(a)) { el['__' + a] = el['__' + a] || el.getAttribute(a); el.setAttribute(a, T(el['__' + a])); }
    }
    document.documentElement.lang = LANG;
  }
  function setLang(c, save) {

    LANG = choice || (/^ru\b/i.test(navigator.language || '') ? 'ru' : 'en');

<script>
  const PORTS = [47215, 47216, 47217, 47218, 47219];
  const $ = (s) => document.getElementById(s);
  const tok = $('tok'), fmt = $('fmt'), go = $('go'), st = $('st'), grid = $('grid'), q = $('q'), folder = $('folder'), board = $('board');
  let port = null, count = 0, sent = 0, items = [], folders = [];
  const empty = (text) => '<div class="empty">' + text + '</div>';
  const status = (t, cls = '') => { st.textContent = t; st.className = cls; };
  const save = () => parent.postMessage({ pluginMessage: { type: 'save', token: tok.value.trim(), format: fmt.value } }, '*');
  const refresh = () => { go.disabled = !count || !tok.value.trim(); go.textContent = count ? T('Отправить в Oddments ({n})', { n: count }) : T('Выделите фреймы или слои'); };
  const api = (path, params = {}) => `http://localhost:${port}${path}?${new URLSearchParams({ ...params, token: tok.value.trim() })}`;

  async function findPerch() {
    for (const p of PORTS) {
      try { const r = await fetch(`http://localhost:${p}/ping`); if ((await r.json()).app === 'perch') return p; } catch (e) { /* next */ }
    }
    return null;
  }

  document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
    document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.id === b.dataset.tab));
  });

  /* ---------- library ---------- */
  async function load() {
    port = port || await findPerch();
    if (!port) { grid.innerHTML = empty(T('Oddments не отвечает: откройте приложение Oddments и нажмите здесь ещё раз.')); grid.onclick = () => { grid.onclick = null; load(); }; return; }
    if (!tok.value.trim()) { grid.innerHTML = empty(T('Вставьте токен ниже: Oddments › Настройки › Интеграции › «Скопировать токен».')); $('tokBox').open = true; return; }
    try {
      const [ri, rl] = await Promise.all([fetch(api('/items')), fetch(api('/library'))]);
      if (ri.status === 401) { grid.innerHTML = empty(T('Oddments не принял токен: скопируйте его заново.')); $('tokBox').open = true; return; }
      if (ri.status === 404) { grid.innerHTML = empty(T('Эта версия Oddments ещё не умеет отдавать библиотеку: обновите Oddments.')); return; }
      items = (await ri.json()).filter((it) => it.thumb);
      folders = (await rl.json()).folders || [];
      folder.length = 1;
      const walk = (p, d) => folders.filter((f) => (f.parent || null) === p).forEach((f) => { folder.add(new Option(' '.repeat(d) + f.name, f.id)); walk(f.id, d + 1); });
      walk(null, 0);
      status(T('В библиотеке: {n}', { n: items.length }));
      render();
      renderIcons();
    } catch (e) { grid.innerHTML = empty(T('Не получилось загрузить библиотеку: ') + e.message); }
  }

  const shown = () => {
    const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean), f = folder.value;
    return items.filter((it) => (!f || it.folders.includes(f)) &&
      words.every((w) => (it.name + ' ' + it.tags.join(' ') + ' ' + it.ai.join(' ')).toLowerCase().includes(w)))
      .sort((a, b) => b.added - a.added);
  };
  const thumbs = new Map();
  async function thumbUrl(it) {
    if (!thumbs.has(it.id)) thumbs.set(it.id, fetch(api('/file', { path: it.thumb })).then((r) => r.blob()).then((b) => URL.createObjectURL(b)).catch(() => ''));
    return thumbs.get(it.id);
  }
  function render() {
    const list = shown().slice(0, 300);
    board.disabled = !folder.value || !list.length;
    $('slidesB').disabled = !folder.value || !list.length;
    // a flow collection (a screen recording cut into screens in Oddments): its button lays out the steps as a prototype
    const fo = folders.find((f) => f.id === folder.value);
    board.textContent = fo && fo.flow ? T('Сценарий') : T('Мудборд');
    $('cjmB').hidden = !(fo && fo.flow);
    board.title = fo && fo.flow ? T('Шаги по порядку, стрелки и кликабельный прототип') : T('Все картинки подборки — во фрейм на холсте');
    grid.innerHTML = list.length ? '' : empty(T('Ничего не нашлось'));
    // thumbnails load as tiles come into view
    const io = new IntersectionObserver((es) => es.forEach(async (e) => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      const u = await thumbUrl(e.target._it);
      if (u) e.target.querySelector('img').src = u;
    }), { root: grid, rootMargin: '200px' });
    for (const it of list) {
      const t = document.createElement('button');
      t.className = 'tile';
      t.title = it.name + (it.tags.length ? ' · #' + it.tags.join(' #') : '') + T('\nКлик — на холст');
      t.innerHTML = '<img alt=""><span></span>';
      t.querySelector('span').textContent = it.name;
      t._it = it;
      t.onclick = () => ($('click').value === 'styles' ? styles(it) : place(it));
      grid.appendChild(t);
      io.observe(t);
    }
  }

  // bytes Figma can take (PNG / JPEG / GIF): the original when it is one of those, otherwise the picture redrawn as PNG
  async function figmaBytes(it) {
    const direct = it.kind === 'image' && /^(png|jpe?g)$/i.test(it.ext) || it.kind === 'gif';
    const r = await fetch(api('/file', { path: direct ? it.file : it.thumb }));
    if (!r.ok) throw new Error(T('Oddments ответил ') + r.status);
    const b = await r.blob();
    if (direct) return new Uint8Array(await b.arrayBuffer());
    const bm = await createImageBitmap(b);
    const c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height;
    c.getContext('2d').drawImage(bm, 0, 0);
    return new Uint8Array(await (await new Promise((res) => c.toBlob(res, 'image/png'))).arrayBuffer());
  }
  async function place(it) {
    status(T('Ставлю «') + it.name + '»…');
    try {
      const bytes = await figmaBytes(it);
      parent.postMessage({ pluginMessage: { type: 'place', bytes, name: it.name, w: it.w, h: it.h, id: it.id, notes: it.notes || [] } }, '*');
      status(T('На холсте: ') + it.name, 'ok');
    } catch (e) { status(T('Не получилось: ') + e.message, 'err'); }
  }
  // the picture's palette (Oddments keeps up to 5 colours) as Figma colour styles
  function styles(it) {
    if (!it.colors || !it.colors.length) { status(T('У этой картинки нет палитры'), 'err'); return; }
    parent.postMessage({ pluginMessage: { type: 'styles', name: it.name, colors: it.colors } }, '*');
    status(T('Стили: {n} цвета «{t}»', { n: it.colors.length, t: it.name }), 'ok');
  }

  /* ---------- icons from the constructor ---------- */
  const ICON = /^(.*) — Size=(\d+), Style=(\w+)$/;
  function iconGroups() {
    const g = new Map();
    for (const it of items) {
      if (it.ext !== 'svg') continue;
      const m = ICON.exec(it.name);
      if (!m) continue;
      const k = m[1];
      if (!g.has(k)) g.set(k, { name: k, variants: [], tags: it.tags || [], added: it.added });
      g.get(k).variants.push({ it, size: +m[2], style: m[3] });
    }
    return [...g.values()].sort((a, b) => b.added - a.added);
  }
  function renderIcons() {
    const words = $('iq').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const list = iconGroups().filter((g) => words.every((w) => (g.name + ' ' + g.tags.join(' ')).toLowerCase().includes(w)));
    const box = $('icList');
    $('allIcons').hidden = list.length < 2;
    $('allIcons').textContent = T('Все в Figma ({n})', { n: list.length });
    if (!list.length) { box.innerHTML = empty(T('Иконок из конструктора пока нет: Oddments › «Конструктор иконок» › «Сохранить в библиотеку».')); return; }
    box.innerHTML = '';
    for (const g of list) {
      const row = document.createElement('div');
      row.className = 'ic-row';
      row.innerHTML = '<img alt=""><b></b><small></small><button class="ghost">' + T('В Figma') + '</button>';
      row.querySelector('b').textContent = g.name;
      row.querySelector('small').textContent = g.variants.length + T(' вар.');
      const v24 = g.variants.find((v) => v.size === 24 && v.style === 'Outline') || g.variants[0];
      fetch(api('/file', { path: v24.it.file })).then((r) => r.blob()).then((b) => { row.querySelector('img').src = URL.createObjectURL(b); }).catch(() => {});
      row.querySelector('button').onclick = () => sendIcon(g);
      box.appendChild(row);
    }
  }
  // the list as it is filtered now, one message: the plugin side lays the sets out in rows
  async function sendAllIcons() {
    const words = $('iq').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const list = iconGroups().filter((g) => words.every((w) => (g.name + ' ' + g.tags.join(' ')).toLowerCase().includes(w)));
    try {
      const icons = [];
      for (const [i, g] of list.entries()) {
        status(T('Собираю иконки: {n} из {all}…', { n: i + 1, all: list.length }));
        const variants = [];
        for (const v of g.variants) variants.push({ size: v.size, style: v.style, svg: await (await fetch(api('/file', { path: v.it.file }))).text() });
        icons.push({ name: g.name, keys: g.tags.filter((t) => t !== 'иконка' && t !== g.name).join(', '), variants });
      }
      parent.postMessage({ pluginMessage: { type: 'icons', icons } }, '*');
    } catch (e) { status(T('Не получилось: ') + e.message, 'err'); }
  }
  $('allIcons').onclick = sendAllIcons;
  async function sendIcon(g) {
    status(T('Собираю «{t}»…', { t: g.name }));
    try {
      const variants = [];
      for (const v of g.variants) variants.push({ size: v.size, style: v.style, svg: await (await fetch(api('/file', { path: v.it.file }))).text() });
      const keys = g.tags.filter((t) => t !== 'иконка' && t !== g.name).join(', ');
      parent.postMessage({ pluginMessage: { type: 'icon', name: g.name, keys, variants } }, '*');
      status(T('«{t}» — набор компонентов на холсте', { t: g.name }), 'ok');
    } catch (e) { status(T('Не получилось: ') + e.message, 'err'); }
  }
  $('iq').oninput = renderIcons;
  $('exSend').onclick = () => { status(T('Ищу иконки в файле…')); parent.postMessage({ pluginMessage: { type: 'examples' } }, '*'); };

  board.onclick = async () => {
    const fo = folders.find((f) => f.id === folder.value);
    if (fo && fo.flow) { flowToFigma(fo); return; }
    const list = shown().slice(0, 60);
    board.disabled = true;
    const out = [];
    for (let i = 0; i < list.length; i++) {
      status(T('Мудборд: {n} из {all}…', { n: i + 1, all: list.length }));
      try { out.push({ bytes: await figmaBytes(list[i]), name: list[i].name, w: list[i].w, h: list[i].h, id: list[i].id }); } catch (e) { /* skip */ }
    }
    parent.postMessage({ pluginMessage: { type: 'board', title: folder.options[folder.selectedIndex].text.trim(), items: out } }, '*');
    status(T('Мудборд готов: {n}', { n: out.length }), 'ok');
    board.disabled = false;
  };
  // «Слайды»: the collection as a deck — one 1920×1080 frame per picture, its name and comments (as «Показ» in Oddments)
  $('slidesB').onclick = async () => {
    const list = shown().slice(0, 80), b = $('slidesB');
    b.disabled = true;
    const out = [];
    for (let i = 0; i < list.length; i++) {
      status(T('Слайды: {n} из {all}…', { n: i + 1, all: list.length }));
      try { out.push({ bytes: await figmaBytes(list[i]), name: list[i].name, w: list[i].w, h: list[i].h, id: list[i].id, notes: list[i].notes || [] }); } catch (e) { /* skip */ }
    }
    parent.postMessage({ pluginMessage: { type: 'slides', title: folder.options[folder.selectedIndex].text.trim(), items: out } }, '*');
    status(T('Слайды готовы: {n}', { n: out.length }), 'ok');
    b.disabled = false;
  };
  // «Сценарий»: the steps in their order, each with the second of the recording it was taken at
  // the same flow as a CJM board (the map's text from Oddments: the collection's cjm field)
  $('cjmB').onclick = async () => {
    const fo = folders.find((f) => f.id === folder.value);
    if (!fo || !fo.flow) return;
    const byId = new Map(items.map((it) => [it.id, it]));
    const steps = (fo.order || []).map((id) => byId.get(id)).filter(Boolean).slice(0, 60);
    if (!steps.length) { status(T('В этом сценарии нет экранов'), 'err'); return; }
    $('cjmB').disabled = true;
    const out = [];
    for (let i = 0; i < steps.length; i++) {
      status(T('CJM: экран {n} из {all}…', { n: i + 1, all: steps.length }));
      try { out.push({ bytes: await figmaBytes(steps[i]), name: steps[i].name, w: steps[i].w, h: steps[i].h, id: steps[i].id, t: steps[i].flowT }); } catch (e) { /* skip */ }
    }
    parent.postMessage({ pluginMessage: { type: 'cjm', title: fo.name, items: out, cjm: fo.cjm || { stages: [], steps: {} } } }, '*');
    status(T('CJM «{t}» на холсте', { t: fo.name }), 'ok');
    $('cjmB').disabled = false;
  };
  async function flowToFigma(fo) {
    const byId = new Map(items.map((it) => [it.id, it]));
    const steps = (fo.order || []).map((id) => byId.get(id)).filter(Boolean).slice(0, 60);
    if (!steps.length) { status(T('В этом сценарии нет экранов'), 'err'); return; }
    board.disabled = true;
    const out = [];
    for (let i = 0; i < steps.length; i++) {
      status(T('Сценарий: {n} из {all}…', { n: i + 1, all: steps.length }));
      try { out.push({ bytes: await figmaBytes(steps[i]), name: steps[i].name, w: steps[i].w, h: steps[i].h, id: steps[i].id, t: steps[i].flowT }); } catch (e) { /* skip */ }
    }
    parent.postMessage({ pluginMessage: { type: 'flow', title: fo.name, items: out } }, '*');
    status(T('Сценарий «{t}» на холсте: экранов {n}', { t: fo.name, n: out.length }), 'ok');
    board.disabled = false;
  }
  let qt = 0;
  q.oninput = () => { clearTimeout(qt); qt = setTimeout(render, 120); };
  folder.onchange = render;

  /* ---------- send ---------- */
  tok.oninput = () => { save(); refresh(); };
  tok.onchange = () => { thumbs.clear(); load(); };
  fmt.onchange = save;
  go.onclick = async () => {
    port = port || await findPerch();
    if (!port) { status(T('Oddments не отвечает: откройте приложение Oddments'), 'err'); return; }
    sent = 0; go.disabled = true; status(T('Экспортирую…'));
    parent.postMessage({ pluginMessage: { type: 'send', format: fmt.value } }, '*');
  };

  $('lang').onchange = () => { setLang($('lang').value, true); refresh(); load(); };

  onmessage = async (ev) => {
    const m = ev.data.pluginMessage;
    if (!m) return;
    if (m.type === 'init') { tok.value = m.token; fmt.value = m.format; count = m.count; setLang(m.lang); $('lang').value = choice; refresh(); load(); }
    else if (m.type === 'count') { count = m.count; refresh(); }
    else if (m.type === 'error') status(m.text, 'err');
    else if (m.type === 'note') status(m.text, m.kind || '');
    else if (m.type === 'file') {
      try {
        const q = new URLSearchParams({ name: m.name, token: tok.value.trim(), source: 'figma' });
        if (m.tags) q.set('tags', m.tags);
        const r = await fetch(`http://localhost:${port}/import?${q}`, { method: 'POST', body: m.bytes });
        if (r.status === 401) { status(T('Oddments не принял токен: скопируйте его заново'), 'err'); refresh(); return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        sent++;
        status(sent === m.total ? T('Готово: отправлено {n}', { n: sent }) : T('Отправлено {n} из {all}…', { n: sent, all: m.total }), sent === m.total ? 'ok' : '');
      } catch (e) { status(T('Не получилось отправить: ') + e.message, 'err'); }
      if (m.index === m.total - 1) refresh();
    }
  };
</script>
