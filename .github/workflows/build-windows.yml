name: Сборка установщика для Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # AutoRemesher (MIT) for quad remeshing: the release build goes into the installer, checked by its SHA-256
      - name: AutoRemesher
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'autoremesher.zip'
          Invoke-WebRequest https://github.com/huxingyi/autoremesher/releases/download/1.2.0/autoremesher-1.2.0-win32-x86_64.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'f6184622cef84f0bcf032a0474df44e2076f4c10c159f1af0cb7230259af7476') { throw "AutoRemesher: checksum mismatch ($hash)" }
          Expand-Archive $zip -DestinationPath src-tauri/resources/autoremesher -Force
          Invoke-WebRequest https://raw.githubusercontent.com/huxingyi/autoremesher/1.2.0/LICENSE -OutFile src-tauri/resources/autoremesher/LICENSE.txt
          Invoke-WebRequest https://raw.githubusercontent.com/huxingyi/autoremesher/1.2.0/ACKNOWLEDGEMENTS.html -OutFile src-tauri/resources/autoremesher/ACKNOWLEDGEMENTS.html
      # the Rust crates of this build and their licence texts go into THIRD_PARTY_NOTICES.md (shown in Settings › О
      # программе › Лицензии and put next to the program)
      - name: Лицензии Rust
        shell: bash
        run: |
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml --filter-platform x86_64-pc-windows-msvc > "$RUNNER_TEMP/cargo-meta.json"
          node tools/notices.mjs --rust "$RUNNER_TEMP/cargo-meta.json"
      # Each signature only when its secrets are there (the public repository's; docs/signing.md), otherwise the build is
      # the same app without it:
      # - the updater key: the installer gets its .sig and can be offered to installed copies (tools/latest-json.mjs);
      # - Azure Artifact Signing: the program and the installer are signed during the build (no SmartScreen warning).
      - name: Сборка
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          CONF=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then CONF+=(--config src-tauri/tauri.updater.conf.json)
          else unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          if [ -n "$AZURE_CLIENT_ID" ]; then
            cargo install trusted-signing-cli --locked
            node -e 'const e = process.env; console.log(JSON.stringify({ bundle: { windows: { signCommand: `trusted-signing-cli -e ${e.AZURE_SIGNING_ENDPOINT} -a ${e.AZURE_SIGNING_ACCOUNT} -c ${e.AZURE_SIGNING_PROFILE} -d Oddments %1` } } }))' > "$RUNNER_TEMP/sign.json"
            CONF+=(--config "$RUNNER_TEMP/sign.json")
          fi
          npm run tauri build -- "${CONF[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: oddments-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
      # a pushed tag v* publishes a draft GitHub Release with the installer attached
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
