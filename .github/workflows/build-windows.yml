name: Сборка установщика для Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # AutoRemesher (MIT) for quad remeshing: the release build goes into the installer, checked by its SHA-256
      - name: AutoRemesher
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'autoremesher.zip'
          Invoke-WebRequest https://github.com/huxingyi/autoremesher/releases/download/1.2.0/autoremesher-1.2.0-win32-x86_64.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'f6184622cef84f0bcf032a0474df44e2076f4c10c159f1af0cb7230259af7476') { throw "AutoRemesher: checksum mismatch ($hash)" }
          Expand-Archive $zip -DestinationPath src-tauri/resources/autoremesher -Force
          Invoke-WebRequest https://raw.githubusercontent.com/huxingyi/autoremesher/1.2.0/LICENSE -OutFile src-tauri/resources/autoremesher/LICENSE.txt
      - run: npm run tauri build
      - uses: actions/upload-artifact@v6
        with:
          name: oddments-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
      # a pushed tag v* publishes a draft GitHub Release with the installer attached
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
