name: Сборка для Mac

# A .dmg for Apple Silicon and Intel at once (universal). Signed with a Developer ID and notarized when the Apple secrets
# are there (docs/signing.md); without them unsigned — the first start is right click › «Открыть» (docs/install.md).
# AutoRemesher has no macOS build — the Mac version goes without it (tauri.macos.conf.json).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Машина GitHub (macos-latest — Apple Silicon; когда их не хватает — macos-15-intel)'
        default: macos-latest
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Safari: the same extension (integrations/browser) through Apple's converter into a small container app,
      # ad-hoc signed (Safari › Develop › «Allow Unsigned Extensions»). It goes inside Oddments.app as a resource (the
      # plugin hub opens it, which registers the extension) and as its own artifact. A failure here does not stop the
      # build: the hub then says the Safari extension is missing.
      - name: Safari extension
        continue-on-error: true
        run: |
          set -e
          mkdir -p src-tauri/resources/safari build-safari
          xcrun safari-web-extension-converter integrations/browser --project-location build-safari             --app-name "Oddments for Safari" --bundle-identifier app.oddments.safari --macos-only --swift             --copy-resources --no-open --no-prompt --force
          PROJ="build-safari/Oddments for Safari/Oddments for Safari.xcodeproj"
          xcodebuild -list -project "$PROJ"
          xcodebuild -project "$PROJ" -scheme "Oddments for Safari" -configuration Release -derivedDataPath build-safari/dd             CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGNING_REQUIRED=NO build
          cp -R "build-safari/dd/Build/Products/Release/Oddments for Safari.app" src-tauri/resources/safari/
          (cd src-tauri/resources/safari && ditto -c -k --keepParent "Oddments for Safari.app" ../../../build-safari/oddments-safari.zip)
      - name: Safari placeholder
        run: mkdir -p src-tauri/resources/safari && [ -e src-tauri/resources/safari/README.txt ] || echo "Safari extension container app (built in CI)" > src-tauri/resources/safari/README.txt
      # the Rust crates of this build and their licence texts go into THIRD_PARTY_NOTICES.md (shown in Settings › О
      # программе › Лицензии and put next to the program)
      - name: Лицензии Rust
        shell: bash
        run: |
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml --filter-platform aarch64-apple-darwin > "$RUNNER_TEMP/cargo-meta.json"
          node tools/notices.mjs --rust "$RUNNER_TEMP/cargo-meta.json"
      # the updater key as on Windows: Oddments.app.tar.gz and its .sig are what installed copies update from. With the
      # Apple secrets Tauri signs the app with the Developer ID (its own temporary keychain) and has Apple notarize it;
      # a secret that is not set is left out, so the build goes on without that step.
      - name: Сборка
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          CONF=(--target universal-apple-darwin)
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then CONF+=(--config src-tauri/tauri.updater.conf.json); fi
          npm run tauri build -- "${CONF[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: oddments-mac-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: oddments-safari
          path: build-safari/oddments-safari.zip
          if-no-files-found: ignore
      # a pushed tag v* publishes a draft GitHub Release with the installer attached
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            build-safari/oddments-safari.zip
