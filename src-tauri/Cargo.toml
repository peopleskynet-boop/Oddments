[package]
name = "perch"
version = "1.2.0"
description = "Oddments — менеджер визуальных референсов"
license = "MIT"
edition = "2021"

[lib]
name = "perch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Cargo.lock is not in git: CI takes the newest crates. The Tauri CLI refuses to build when a plugin crate and its
# npm package (package-lock.json) differ in major/minor (build #54: tauri-plugin-http 2.9.0 vs @tauri-apps/plugin-http
# 2.8.3), so the crates with an npm twin are held to the npm minor (~). Raise both together.
tauri = { version = "~2.12", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-fs = "~2.7"
tauri-plugin-dialog = "~2.8"
tauri-plugin-http = { version = "~2.8", features = ["unsafe-headers"] }
tauri-plugin-clipboard-manager = "~2.5"
tauri-plugin-opener = "~2.7"
tauri-plugin-persisted-scope = "2"
# dragging files out of Perch into other programs (CrabNebula, MIT/Apache)
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
# updates of the app from the public repository's releases (signed; lib/updater.js) and the restart after one
tauri-plugin-updater = "~2.14"
tauri-plugin-process = "~2.4"
# the system-wide key «в Oddments» (Ctrl+Alt+V) and the notification after it (hotkey.rs); used from Rust only, so
# there is no npm twin to keep in step with
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

# tao (Tauri's window event loop) 0.37.2 with one fix (bug #127, tauri-apps/tao#1410): a WM_PAINT re-entered from the
# Windows input methods hit an assert and closed the app. The rest of the crate is as published on crates.io. Remove
# this and patches/tao once a tao release has the fix; a newer 0.37.x from crates.io wins over this copy by itself
# (there is no Cargo.lock), so check its changelog when one comes out.
[patch.crates-io]
tao = { path = "patches/tao" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
# no panic = "abort": a panic inside a plugin (the clipboard reading an odd bitmap from a browser's «Copy image»)
# closed the whole app; unwinding lets Tauri turn it into an error for that one call
